<style>
  :root{
    --bg:#0a130f; --card:#111e18; --card2:#16271f; --line:#26392f;
    --mint:#14D3A9; --coral:#ED6965; --canary:#FFFD82; --blue:#5BA8F5;
    --tx:#EAF3EF; --tx2:#9bb3a8; --tx3:#6a8478; --accent:var(--mint);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--tx);font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:40px;background-image:radial-gradient(900px 400px at 50% -5%, rgba(20,211,169,.08), transparent 60%);}
  body[data-p="nina"]{--accent:var(--coral)} body[data-p="mael"]{--accent:var(--mint)} body[data-p="tom"]{--accent:var(--blue)}
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .topbar{padding:14px 14px 4px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .topbar .logo{font-size:18px}
  .topbar .ttl{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:700}

  .statusbar{max-width:560px;margin:0 auto;padding:4px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .statusbar #status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3)}
  .statusbar #status.err{color:var(--coral)} .statusbar #status.live{color:var(--mint)}
  .refresh{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;white-space:nowrap}
  .refresh:active{transform:scale(.97)} .refresh.spin{opacity:.5}

  .tabs{display:flex;gap:6px;max-width:560px;margin:6px auto 4px;padding:0 14px}
  .tabs button{flex:1;padding:11px;border-radius:12px 12px 0 0;border:1px solid var(--line);border-bottom:none;
    background:var(--card);color:var(--tx2);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
  .tabs button.act{background:var(--card2);color:var(--tx);border-color:var(--accent)}

  .toggle{display:flex;gap:6px;margin:12px 0 14px}
  .toggle button{flex:1;padding:12px 4px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);
    color:var(--tx2);font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;transition:.15s}
  .toggle button[data-on="nina"].act{border-color:var(--coral);color:var(--coral);background:rgba(237,105,101,.1)}
  .toggle button[data-on="mael"].act{border-color:var(--mint);color:var(--mint);background:rgba(20,211,169,.1)}
  .toggle button[data-on="tom"].act{border-color:var(--blue);color:var(--blue);background:rgba(91,168,245,.1)}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent)}
  .hero .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
  .hero .total{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:54px;line-height:1;color:var(--accent);letter-spacing:-.03em;margin-top:4px}
  .hero .total small{font-size:16px;color:var(--tx3);font-weight:500;letter-spacing:0}
  .hero .stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
  .hero .stats div{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx2);font-weight:500}
  .hero .stats b{color:var(--tx)}
  .hero .rival{margin-top:10px;font-size:12.5px;color:var(--tx2)}
  .hero .rival .gap{font-family:'JetBrains Mono',monospace;font-weight:800}
  .hero .x2info{margin-top:8px;font-size:11.5px;color:var(--canary);font-family:'JetBrains Mono',monospace}
  .emptyhint{margin-top:10px;font-size:12px;color:var(--blue);font-weight:600}

  .actions{display:flex;gap:8px;margin:12px 0 4px}

function matchPts(m,pr){const k=pr[0],l=pr[1];
  if(k==null||l==null)return null; if(m.r1==null)return null;
  const ks=sign(k,l),rs=sign(m.r1,m.r2);let p=0;
  if(ks===rs){let c=ks>0?m.c1:(ks===0?m.cN:m.c2);p=c||0;}
  if(k===m.r1&&l===m.r2)p+=20; return p;}

    const e=effPts(m,pr,p);if(e!=null){tot+=e;if(sign(pr[0],pr[1])===sign(m.r1,m.r2))bons++;if(pr[0]===m.r1&&pr[1]===m.r2)exacts++;}});
  return {tot,bons,exacts,played,filled};}

// ---- PROJECTION ----
function potential(p){let v=0;DATA.forEach(m=>{if(m.r1==null){const pr=P[p][m.id];if(pr&&pr[0]!=null){
  const s=sign(pr[0],pr[1]);let c=(s>0?m.c1:(s===0?m.cN:m.c2))||0;let mx=c+20;if(X2[p]===m.id)mx*=2;v+=mx;}}});return v;}
function remFilled(p){let n=0;DATA.forEach(m=>{if(m.r1==null&&P[p][m.id][0]!=null)n++;});return n;}
function renderProjection(){
  const rows=PLAYERS.map(p=>{const t=totals(p.id).tot,pot=potential(p.id);return {n:NAME[p.id],col:p.col,now:t,pot,ceil:t+pot,rem:remFilled(p.id)};});
  const maxCeil=Math.max(...rows.map(r=>r.ceil),1);
  const byNow=rows.slice().sort((a,b)=>b.now-a.now);const leader=byNow[0];
  const bars=byNow.map(r=>{const wNow=r.now/maxCeil*100,wCeil=r.ceil/maxCeil*100;
    return '<div class="pjrow"><div class="pjhd"><span class="pjnm" style="color:'+r.col+'">'+r.n+'</span>'
      +'<span class="pjval"><b>'+r.now+'</b> · en jeu +'+r.pot+' · plafond <b>'+r.ceil+'</b></span></div>'
      +'<div class="pjbar"><div class="pjghost" style="width:'+wCeil+'%;background:'+r.col+'"></div>'
      +'<div class="pjfill" style="width:'+wNow+'%;background:'+r.col+'"></div></div></div>';}).join('');
  const chasers=byNow.slice(1).filter(r=>r.ceil>leader.now);
  let note;
  if(rows.every(r=>r.rem===0))note='Tous les pronos restants sont joués : classement quasi figé.';
  else if(!chasers.length)note='<b>'+leader.n+'</b> ne peut plus être rattrapé sur les pronos déjà posés.';
  else note=chasers.map(r=>r.n+' peut repasser devant '+leader.n+' (retard '+(leader.now-r.now)+', plafond +'+r.pot+')').join('. ')+'.';
  document.getElementById('cmpProj').innerHTML='<div class="proj"><h3>Projection</h3>'
    +'<p class="sub">Barre pleine = points actuels · halo = plafond si tous les pronos restants tombent juste.</p>'
    +bars+'<div class="pjnote">'+note+'</div></div>';}

// ---- POULES (classement des groupes) ----
function teamsOf(g){const map={};DATA.filter(m=>m.g===g).forEach(m=>{map[m.fr1]={fl:m.fl1};map[m.fr2]={fl:m.fl2};});return map;}
function standings(g){const meta=teamsOf(g);const t={};const init=n=>t[n]||(t[n]={pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  Object.keys(meta).forEach(init);
  DATA.filter(m=>m.g===g&&m.r1!=null).forEach(m=>{const a=init(m.fr1),b=init(m.fr2);
    a.pl++;b.pl++;a.gf+=m.r1;a.ga+=m.r2;b.gf+=m.r2;b.ga+=m.r1;
    if(m.r1>m.r2){a.w++;b.l++;a.pts+=3;}else if(m.r1<m.r2){b.w++;a.l++;b.pts+=3;}else{a.d++;b.d++;a.pts++;b.pts++;}});
  return Object.keys(t).map(n=>({name:n,fl:meta[n].fl,pl:t[n].pl,gd:t[n].gf-t[n].ga,gf:t[n].gf,pts:t[n].pts}))
    .sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.name.localeCompare(y.name));}
function renderPoules(){
  let html='<div class="pleg"><i class="q">qualifié (top 2)</i><i class="t3">3e (barragiste possible)</i></div>';
  GROUPS.forEach(g=>{const s=standings(g);
    html+='<div class="pgrp"><h4>Groupe '+g+'</h4><table class="ptab">'
      +'<tr><th class="l">#&nbsp;&nbsp;Équipe</th><th>J</th><th>Diff</th><th>Pts</th></tr>';
    s.forEach((r,i)=>{const cls=i<2?'pq':(i===2?'p3':'');
      html+='<tr class="'+cls+'"><td class="l"><span class="prk">'+(i+1)+'</span> '+r.fl+' '+r.name+'</td>'
        +'<td>'+r.pl+'</td><td>'+(r.gd>0?'+'+r.gd:r.gd)+'</td><td class="pts">'+r.pts+'</td></tr>';});
    html+='</table></div>';});
  html+='<div class="pleg" style="margin-top:-4px">Classement indicatif (départage simplifié : points, diff, buts marqués).</div>';
  document.getElementById('poules').innerHTML=html;}

function chrono(m){if(m.time){const d=new Date(m.time);if(!isNaN(d))return d.getTime();}const p=(m.date||'').split('/');if(p.length===2)return new Date(2026,(+p[1])-1,(+p[0])).getTime();return 0;}

  const last=played.slice(0,6);
  if(!last.length){el.innerHTML='';return;}
  let html='<div class="recap"><h4>Derniers matchs</h4>';
  last.forEach(m=>{const live=m.live===true,sc=m.r1!=null?(m.r1+'–'+m.r2):'';

function lsKO(p){return 'cdm2026_ko_'+p;}
function loadKO(){for(const p of ['nina','mael','tom']){try{const s=localStorage.getItem(lsKO(p));if(s)KOP[p]=JSON.parse(s)||{};}catch(e){}}}
function saveKO(p){try{localStorage.setItem(lsKO(p),JSON.stringify(KOP[p]||{}));}catch(e){}}
function groupComplete(g){const ms=DATA.filter(m=>m.g===g);return ms.length>0&&ms.every(m=>m.r1!=null);}
function allGroupsDone(){return GROUPS.every(groupComplete);}
function qualifiers(){
  const W={},R={},rows3=[],third={},nameIdx={};
  GROUPS.forEach(g=>{if(groupComplete(g)){const s=standings(g);W[g]=s[0];R[g]=s[1];rows3.push({g:g,t:s[2]});nameIdx[s[0].name]=s[0];nameIdx[s[1].name]=s[1];}});
  if(allGroupsDone()){
    rows3.sort((a,b)=>b.t.pts-a.t.pts||b.t.gd-a.t.gd||b.t.gf-a.t.gf||a.g.localeCompare(b.g));
    const best=rows3.slice(0,8),key=best.map(x=>x.g).sort().join(''),assign=KO3[key];
    if(assign){const cols=['1A','1B','1D','1E','1G','1I','1K','1L'],byG={};best.forEach(x=>byG[x.g]=x.t);
      cols.forEach((c,i)=>{const tt=byG[assign[i]];third[c]=tt;if(tt)nameIdx[tt.name]=tt;});}
  }
  return {W,R,third,nameIdx};
}
function teamFor(spec,Q){if(spec.t==='W')return Q.W[spec.g];if(spec.t==='R')return Q.R[spec.g];if(spec.t==='3')return Q.third[spec.col];return null;}
function specLabel(spec){if(spec.t==='W')return 'Vainqueur gr. '+spec.g;if(spec.t==='R')return '2e gr. '+spec.g;return '3e ('+TH3[spec.col]+')';}
function tieById(m){return R32.find(t=>t.m===m)||RTREE.find(t=>t.m===m);}
function winnerOf(m,Q){const pk=(KOP[player]||{})[m];if(!pk)return null;return Q.nameIdx[pk]||{name:pk,fl:''};}
function teamInSlot(m,side,Q){const t=tieById(m);if(!t)return null;
  if(R32IDS.indexOf(m)>=0){return teamFor(side==='a'?t.a:t.b,Q);}
  return winnerOf(side==='a'?t.a:t.b,Q);}
function clearDownstream(m){const nxt=RTREE.find(t=>t.a===m||t.b===m);if(!nxt)return;if((KOP[player]||{})[nxt.m]!==undefined){delete KOP[player][nxt.m];clearDownstream(nxt.m);}}
function pickWin(m,name){if(!KOP[player])KOP[player]={};if(KOP[player][m]===name)delete KOP[player][m];else KOP[player][m]=name;clearDownstream(m);saveKO(player);renderBracket();}
function resetKO(){KOP[player]={};saveKO(player);renderBracket();toast('Pronos coupe effacés');}
function esc(s){return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function tieHTML(m,Q){
  const t=tieById(m),ta=teamInSlot(m,'a',Q),tb=teamInSlot(m,'b',Q),pk=(KOP[player]||{})[m];
  function row(side,tm){
    if(!tm){let lbl;if(R32IDS.indexOf(m)>=0)lbl=specLabel(side==='a'?t.a:t.b);else lbl='Vainqueur M'+(side==='a'?t.a:t.b);
      return '<div class="tm ph"><span class="nm lab">'+lbl+'</span></div>';}
    const sel=pk&&pk===tm.name;
    return '<div class="tm'+(sel?' pk':'')+'" onclick="pickWin('+m+',\''+esc(tm.name)+'\')"><span class="fl">'+(tm.fl||'')+'</span><span class="nm">'+tm.name+'</span></div>';
  }
  return '<div class="tie" data-m="'+m+'">'+row('a',ta)+row('b',tb)+'<div class="mno">M'+m+'</div></div>';
}
function renderBracket(){
  const Q=qualifiers();
  const cols=[
    {h:'16es',ids:[73,75,74,77,76,78,79,80,83,84,81,82,86,88,85,87]},
    {h:'8es',ids:[90,89,91,92,93,94,95,96]},
    {h:'Quarts',ids:[97,98,99,100]},
    {h:'Demies',ids:[101,102]},
    {h:'Finale',ids:[104],fin:true}
  ];
  const colsHtml=cols.map(c=>'<div class="brkcol'+(c.fin?' brkfin':'')+'"><div class="brkrnd">'+c.h+'</div><div class="brktie">'+c.ids.map(m=>tieHTML(m,Q)).join('')+'</div></div>').join('');
  document.getElementById('bracket').innerHTML=
    '<div class="brkhead"><h3>Phase finale</h3><button class="brkreset" onclick="resetKO()">↺ Mes pronos</button></div>'
    +'<div class="brkhint">Touche l\'équipe qui passe (pronos de '+NAME[player]+'). 1ers/2es affichés dès qu\'un groupe est terminé, 3es dès que les 12 groupes sont finis.</div>'
    +'<div class="brkscroll"><div class="brkcols">'+colsHtml+'</div></div>';

}
function drawBrkLines(){
  const wrap=document.querySelector('.brkcols');if(!wrap)return;
  const old=wrap.querySelector('svg.brklines');if(old)old.remove();
  const get=m=>wrap.querySelector('.tie[data-m="'+m+'"]');
  let p='';
  RTREE.forEach(t=>{const tgt=get(t.m);if(!tgt)return;
    const tx=tgt.offsetLeft,ty=tgt.offsetTop+tgt.offsetHeight/2;
    [t.a,t.b].forEach(s=>{const src=get(s);if(!src)return;
      const sx=src.offsetLeft+src.offsetWidth,sy=src.offsetTop+src.offsetHeight/2,mx=(sx+tx)/2;
      p+='<path d="M'+sx+' '+sy+' H'+mx+' V'+ty+' H'+tx+'"/>';});});
  const W=wrap.scrollWidth||wrap.offsetWidth,H=wrap.offsetHeight;
  wrap.insertAdjacentHTML('afterbegin','<svg class="brklines" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+p+'</svg>');
}

  try{
    const dates=espnDates(full||manual);
    const settled=await Promise.allSettled(dates.map(d=>fetch(ESPN+d,{cache:'no-store'}).then(r=>r.ok?r.json():null)));
    settled.forEach(s=>{if(s.status!=='fulfilled'||!s.value)return;const j=s.value;
      (j.events||[]).forEach(ev=>{const comp=(ev.competitions||[])[0];if(!comp)return;
        const cs=comp.competitors||[];if(cs.length!==2)return;
        const home=cs.find(c=>c.homeAway==='home')||cs[0],away=cs.find(c=>c.homeAway==='away')||cs[1];
        const hn=tnorm((home.team||{}).displayName||(home.team||{}).name),an=tnorm((away.team||{}).displayName||(away.team||{}).name);
        const stt=ev.status||{},typ=stt.type||{},state=typ.state||'';
        const f=FX[[hn,an].sort().join('|')];
        if(!f){const kf=KOFX[[hn,an].sort().join('|')];
          if(kf){const km=KO_LIST.find(x=>x.id===kf.id);if(km){if(ev.date){km.time=ev.date;}
            if(state==='pre'){km.live=false;km.clock='';}
            else{const hs=parseInt(home.score),as=parseInt(away.score);if(!isNaN(hs)&&!isNaN(as)){if(hn===kf.e1){km.r1=hs;km.r2=as;}else{km.r1=as;km.r2=hs;}}km.live=(state==='in');km.clock=(state==='in')?(stt.displayClock||typ.shortDetail||''):'';}}
            return;}
          const ha=TEAMINFO[hn],aa=TEAMINFO[an];if(!ha||!aa)return;
          const eid=parseInt(ev.id)||(1e9+hn.length*1000+an.length);
          const e=EXTRA[eid]||(EXTRA[eid]={id:eid,ko:true,g:'KO',j:'Phase finale'});
          e.fr1=ha.fr;e.fl1=ha.fl;e.fr2=aa.fr;e.fl2=aa.fl;
          e.round=(comp.notes&&comp.notes[0]&&comp.notes[0].headline)||e.round||'Phase finale';
          const cc=KOCOTES[[hn,an].sort().join('|')];if(cc){e.cN=cc.nul;e.c1=cc[hn];e.c2=cc[an];}
          if(ev.date){e.time=ev.date;const d=new Date(ev.date);if(!isNaN(d))e.date=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
          if(state==='pre'){e.live=false;e.clock='';e.r1=null;e.r2=null;}
          else{const hs=parseInt(home.score),as=parseInt(away.score);if(!isNaN(hs)&&!isNaN(as)){e.r1=hs;e.r2=as;}e.live=(state==='in');e.clock=(state==='in')?(stt.displayClock||typ.shortDetail||''):'';}
          return;}
        const m=DATA.find(x=>x.id===f.id);if(!m)return;
        if(ev.date)m.time=ev.date;
        if(state==='pre'){m.live=false;m.clock='';return;}
        const hs=parseInt(home.score),as=parseInt(away.score);if(isNaN(hs)||isNaN(as))return;
        let r1,r2;if(hn===f.e1){r1=hs;r2=as;}else{r1=as;r2=hs;}
        m.live=(state==='in');m.clock=(state==='in')?(stt.displayClock||typ.shortDetail||''):'';
        if(m.r1!==r1||m.r2!==r2){m.r1=r1;m.r2=r2;upd++;}});
      ok=true;src='ESPN';});
  }catch(e){ok=false;}
  // 2) repli results.json (flux GitHub Actions)
  if(!ok){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});const j=await r.json();const sc=j.scores||j;
    DATA.forEach(m=>{const v=sc[m.id];if(v){m.live=(v[2]==='live');if(v[3])m.time=v[3];if(v[0]!=null&&(m.r1!==v[0]||m.r2!==v[1])){m.r1=v[0];m.r2=v[1];upd++;}}});
    ok=true;src='cache';}catch(e2){}}
  if(ok){const hh=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    setStatus('Scores à jour · '+hh+(upd?(' · '+upd+' maj'):''),'live');
    renderHero();renderLive();renderList();if(view==='compare')renderCompare();if(view==='poules')renderPoules();if(view==='bracket')renderBracket();
    if(manual)toast(upd?upd+' score(s) mis à jour':'Déjà à jour');}
  else{setStatus('Hors ligne — derniers scores connus','err');if(manual)toast('Mise à jour impossible');}
  btn.classList.remove('spin');}

function exportPronos(){const out=DATA.map(m=>({id:m.id,g:m.g,j:m.j,match:m.fr1+' - '+m.fr2,prono:P[player][m.id],x2:X2[player]===m.id}));
  const blob=new Blob([JSON.stringify({joueur:NAME[player],x2_match:X2[player],pronos:out},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pronos_'+NAME[player]+'.json';a.click();toast('Pronos exportés ✓');}
function resetPronos(){if(!confirm('Remettre les pronos d\'origine pour '+NAME[player]+' ?'))return;
  DATA.forEach(m=>{P[player][m.id]=player==='tom'?(m.tom||[null,null]).slice():(player==='nina'?m.nina:m.mael).slice();});X2[player]=null;
  saveP(player);saveX(player);renderHero();renderList();toast('Réinitialisé');}
let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

document.getElementById('foot').innerHTML='Scores mis à jour automatiquement à l\'ouverture, puis toutes les minutes tant que l\'appli reste ouverte, et via le bouton 🔄. Flèches ▲▼ pour les pronos. Bouton ×2 : double UN match (un seul par joueur). Calcul : cote de la bonne issue + 20 si score exact, doublé si ×2. Pronos gardés sur l\'appareil, jamais écrasés par la mise à jour.';

load();
try{const s=localStorage.getItem('cdm2026_sort');if(s==='date'||s==='poule')sortMode=s;}catch(e){}
try{const v=localStorage.getItem('cdm2026_live_hidden');liveHidden=(v===null?true:v==='1');}catch(e){}
try{const s=localStorage.getItem('cdm2026_live_sec');if(s)SEC=Object.assign(SEC,JSON.parse(s));}catch(e){}
loadKO();
setSort(sortMode);setPlayer('nina');renderChips();
fetchScores(false,true);
setInterval(()=>{if(!document.hidden)fetchScores(false);},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchScores(false);});
window.addEventListener('resize',()=>{if(view==='bracket')drawBrkLines();});
</script>
